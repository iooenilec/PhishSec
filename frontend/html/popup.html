<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail Phishing Detector</title>
    <style>
      html{
        overflow: auto;
      }

      body {
        /* width: 400px;
        margin: 0 auto;
        padding: 20px; */
        width: 300px;
        border: 1px solid #cccccc;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        padding-left: 10px;
        padding-right: 10px;
        font-family: "Segoe UI", Tahoma, sans-serif;
        font-size: 75%;
        justify-content: center;
        align-items: center;
        margin: 0;
        background-image: url("../icons/background.avif"); /* Replace with actual image path */
        background-repeat: no-repeat; /* Optional: control how the image repeats */
        background-position: center; /* Optional: control the position of the image */
        background-size: cover; /* Optional: control the size of the image */
        /*overflow-y: scroll; */
        overflow-x: hidden;
      }

      body::-webkit-scrollbar {
        width: 10px;
      }
 
      body::-webkit-scrollbar-track {
        background-color: #ebebeb;
        -webkit-border-radius: 10px;
        border-radius: 10px;
      }

      body::-webkit-scrollbar-thumb {
        -webkit-border-radius: 10px;
        border-radius: 10px;
        background: #6d6d6d; 
      }

      header{
        position: fixed;
        height: 200px;
        width: 100%; /* Expands the header to full width */
        /* Remove or adjust margin for spacing */
        display: inline-block;
        justify-content: space-between;
        padding-left: 10px;
        padding-right: 10px;
        border-bottom: 1px solid #ddd;
        z-index: 4;
        top: 0;
        color: white;
        mix-blend-mode: difference;
      }
      h1 {
        /* text-align: center;
        color: #333; */
        /*display: flex;
        align-items: center;
        margin-bottom: 10px;
        font-weight: bold; */
        height: 100px;
        margin: auto 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px;
        border-bottom: 1px;
        background: -webkit-linear-gradient(#eeeeeedb, #312f2f);
        background-clip: text;
        -webkit-text-fill-color: transparent;

      }
      .button {
        /* display: block;
        width: 100%;
        padding: 10px;
        margin-top: 20px;
        background-color: #007bff;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer; */
        display: inline-flex; 
        flex-direction: row;
        align-items: center; 
        padding: 6px 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
        border-radius: 6px;
        border: none;

        color: #fff;
        background: linear-gradient(180deg, #4B91F7 0%, #367AF6 100%);
        background-origin: border-box;
        box-shadow: 0px 0.5px 1.5px rgba(54, 122, 246, 0.25), inset 0px 0.8px 0px -0.25px rgba(255, 255, 255, 0.2);
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }
      .button:hover {
        box-shadow: inset 0px 0.8px 0px -0.25px rgba(255, 255, 255, 0.2), 0px 0.5px 1.5px rgba(54, 122, 246, 0.25), 0px 0px 0px 3.5px rgba(58, 108, 217, 0.5);
        outline: 0;
      }
      .delete-button {
        display: inline-flex;
        flex-direction: row;
        align-items: center;
        padding: 6px 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
        border-radius: 6px;
        border: none;

        color: #fff;
        background: linear-gradient(180deg, #f74b4b 0%, #f63636 100%);
        background-origin: border-box;
        box-shadow: 0px 0.5px 1.5px rgba(246, 54, 54, 0.25), inset 0px 0.8px 0px -0.25px rgba(255, 255, 255, 0.2);
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
  
      }
      .delete-button:hover {
        box-shadow: inset 0px 0.8px 0px -0.25px rgba(255, 60, 60, 0.2), 0px 0.5px 1.5px rgba(246, 54, 54, 0.25), 0px 0px 0px 3.5px rgba(217, 58, 58, 0.5);
        outline: 0;
      }
      .message {
        padding: 15px;
        border-bottom: 3px solid #dddddd5c;
        margin-bottom: 10px;
        background-color: #f9f9f985;
        border-radius: 5px;
        box-shadow: rgba(82, 82, 83, 0.2) 0px 7px 29px 0px;
      }
      .spam {
        color: red;
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 100%;
        font-style: italic;
        /* font-weight: bold ; */
        margin-bottom: 20px;
        box-shadow: rgba(163, 23, 23, 0.4) 0px 0px 0px 2px, rgba(44, 6, 6, 0.65) 0px 4px 6px -1px, rgba(200, 33, 33, 0.248) 0px 1px 0px inset;

      }
      .button-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;

      }
      .subject{
        font-weight: bold;
        margin-bottom: 5px;
      }
      .snippet{
        margin-bottom: 10px;
      }
